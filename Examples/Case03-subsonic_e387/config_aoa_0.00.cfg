% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
RESTART_ITER=17401
SOLVER= RANS
KIND_TURB_MODEL= SST
KIND_TRANS_MODEL= LM
LM_OPTIONS= (MENTER_LANGTRY, MENTER_LANGTRY, NONE)

% Adjusted to match Ncrit = 5 (earlier transition, smaller bubble, higher CL, lower CD)
FREESTREAM_TURBULENCEINTENSITY= 0.003
FREESTREAM_TURB2LAMVISCRATIO= 2.0
FREESTREAM_INTERMITTENCY= 1.0

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE
MACH_NUMBER= 0.100000
AOA= 0.000000
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
REYNOLDS_NUMBER= 60000
REYNOLDS_LENGTH= 1.0

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
MARKER_HEATFLUX= ( Airfoil, 0.0 )
MARKER_FAR= ( Inlet, Outlet )

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 0.0

% ------------------------ SURFACES IDENTIFICATION ----------------------------%
MARKER_PLOTTING= ( Airfoil )
MARKER_MONITORING= ( Airfoil )

% ----------------------------- DISCRETIZATION --------------------------------%
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
% Increased dt to allow flow to cover ~10 chord lengths in 600 steps
TIME_STEP= 0.00005

% ---------------------- NUMERICAL METHODS ------------------------------------%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
% Dedicated Low-Mach Roe scheme paired with preconditioning
CONV_NUM_METHOD_FLOW= LMROE
LOW_MACH_PREC= YES
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= YES

% -------------------------- SOLUTION METHODS ---------------------------------%
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.1, 1.0, 50.0 )

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 0.001
LINEAR_SOLVER_ITER= 25

% --------------------------- INNER CONVERGENCE -------------------------------%
INNER_ITER= 30
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -8.0
CONV_STARTITER= 0

% ---------------------------- TIME CONVERGENCE -------------------------------%
% 600 * 0.0005s = 0.3s (~10 convective chord lengths)
TIME_ITER= 100000

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
% Drop TECPLOT_ASCII (the biggest files); PARAVIEW already gives the .vtu
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)

% Write restart, .vtu and surface CSV only every 100 time iterations
OUTPUT_WRT_FREQ= 200

% Write history rows only every 100 time iterations (default is 1)
HISTORY_WRT_FREQ_TIME= 100
HISTORY_WRT_FREQ_INNER= 0

MESH_FILENAME= airfoil.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out.su2
SOLUTION_FILENAME= restart_flow.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= history_aoa_0.00
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow_aoa_0.00
SURFACE_FILENAME= surf_aoa_0.00
SCREEN_OUTPUT = (TIME_ITER, INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_ENERGY, LIFT, DRAG, MOMENT)
HISTORY_OUTPUT = (ITER, RMS_RES, AERO_COEFF, AOA)