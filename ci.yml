name: tests
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requirements.txt pins pandas 3.x, which needs Python 3.11 or newer
        python-version: ["3.11"]
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for gmsh and Qt
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl1 libglu1-mesa libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          libxrender1 libxcursor1 libxft2 libxinerama1 xvfb
      - run: pip install -r requirements.txt pytest openpyxl
      - run: xvfb-run -a python -m pytest -m "not slow" -v